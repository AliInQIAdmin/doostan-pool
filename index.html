  const s=Math.floor(ms/1000);

function scorePick(pk,res){
  const ph=+pk.h, pa=+pk.a, rh=+res.h, ra=+res.a;
  if(ph===rh&&pa===ra) return {pts:PTS.EXACT,tier:"exact"};
  if(outcome(ph,pa)!==outcome(rh,ra)) return {pts:0,tier:"miss"};
  if(ph-pa===rh-ra) return {pts:PTS.GD,tier:"gd"};
  return {pts:PTS.RESULT,tier:"result"};
}

  const [poolName,setPoolName]=useState("World Cup 2026 Pool");
  const [commissioner,setCommissioner]=useState(null);
  const [players,setPlayers]=useState([]);
  const [allPicks,setAllPicks]=useState({});    // {uid:{mid:{h,a,banker}}}
  const [results,setResults]=useState({});      // {mid:{h,a}}
  const [odds,setOdds]=useState({});             // {mid:{h,d,a}} market probabilities
  const [kickoffs,setKickoffs]=useState({});     // {mid: ISO} real kickoff times from the live feed
  const [myS,setMyS]=useState({}); const [myB,setMyB]=useState({});
  const [dirty,setDirty]=useState(false);
  const [tab,setTab]=useState("picks");
  const [now,setNow]=useState(Date.now());
  const [toast,setToast]=useState("");
  const [resultDraft,setResultDraft]=useState({});
  const [openGroups,setOpenGroups]=useState(()=>new Set(["A"]));
  // auth form
  const [authMode,setAuthMode]=useState("login");
  const [fEmail,setFEmail]=useState(""); const [fName,setFName]=useState("");
  const [fPass,setFPass]=useState(""); const [fPool,setFPool]=useState("World Cup 2026 Pool");
  const [fInvite,setFInvite]=useState("");
  const [busy,setBusy]=useState(false);
  const [recovery,setRecovery]=useState(false); const [newPass,setNewPass]=useState("");

  const flash=(m)=>{setToast(m);setTimeout(()=>setToast(""),2800);};

  const loadAll = useCallback(async (uid)=>{
    const [{data:profs},{data:resRows},{data:pm},{data:mt}] = await Promise.all([
      sb.from("profiles").select("*"),
      sb.from("results").select("*"),
      sb.from("pool_meta").select("*").eq("id",1).maybeSingle(),
      sb.from("matches").select("id,kickoff"),
    ]);
    // Picks can exceed Supabase's 1000-row response cap, so page through ALL of them.
    let picksRows=[]; { const page=1000; let from=0;
      while(true){ const { data } = await sb.from("picks").select("*").range(from,from+page-1);
        if(!data||!data.length) break; picksRows=picksRows.concat(data);
        if(data.length<page) break; from+=page; } }
    setPlayers((profs||[]).map(p=>({id:p.id,name:p.display_name})));
    const km={}; (mt||[]).forEach(r=>{ if(r.kickoff) km[r.id]=r.kickoff; }); setKickoffs(km);
    const map={};
    (picksRows||[]).forEach(r=>{(map[r.user_id]??={})[r.match_id]={h:r.home,a:r.away,banker:r.is_banker};});
    setAllPicks(map);
    const rmap={}; (resRows||[]).forEach(r=>{rmap[r.match_id]={h:r.home,a:r.away};});
    setResults(rmap); setResultDraft(rmap);
    try{ const {data:oddsRows}=await sb.from("match_odds").select("*"); const om={}; (oddsRows||[]).forEach(o=>{om[o.match_id]={h:o.home_pct,d:o.draw_pct,a:o.away_pct};}); setOdds(om); }catch(e){ setOdds({}); }
    if(pm){setPoolName(pm.name);setCommissioner(pm.commissioner);}
    if(uid && map[uid]){
      const s={},b={};
      Object.entries(map[uid]).forEach(([mid,v])=>{s[mid]={h:v.h,a:v.a};if(v.banker)b[matchById[mid].g]=mid;});
      if(!dirty){setMyS(s);setMyB(b);}
    }
  },[dirty]);

  // boot + auth listener
  useEffect(()=>{
    let sub;
    (async()=>{
      const { data:{ session } } = await sb.auth.getSession();
      if(session){ await hydrateMe(session.user); }
      else { await loadAll(null); }
      setBooting(false);
    })();
    sub = sb.auth.onAuthStateChange((evt,session)=>{
      if(evt==="PASSWORD_RECOVERY"){ setRecovery(true); setBooting(false); return; }
      if(session) hydrateMe(session.user); else { setMe(null); }
    });
    const t=setInterval(()=>setNow(Date.now()),1000);
    return ()=>{ try{sub.data.subscription.unsubscribe();}catch(e){} clearInterval(t); };
  },[]);

  async function hydrateMe(user){
    let { data:prof } = await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
    if(!prof){ // safety: create a profile if missing
      await sb.from("profiles").insert({id:user.id,email:user.email,display_name:(user.email||"Player").split("@")[0]});
      prof = (await sb.from("profiles").select("*").eq("id",user.id).maybeSingle()).data;
    }
    setMe({id:user.id,name:prof?prof.display_name:"Player",email:user.email});
    await loadAll(user.id);
  }

  // periodic refresh of shared data (keeps leaderboard fresh)
  useEffect(()=>{
    if(!me) return;
    const poll=setInterval(()=>loadAll(me.id),25000);
    const onFocus=()=>loadAll(me.id);
    window.addEventListener("focus",onFocus);
    return ()=>{clearInterval(poll);window.removeEventListener("focus",onFocus);};
  },[me,loadAll]);

  const koTime=(m)=> kickoffs[m.id]?Date.parse(kickoffs[m.id]):Date.parse(m.utc);
  const isLocked=(m)=> now>=koTime(m);
  const isCommish = me && commissioner===me.id;

  // ---- AUTH ----
  const doAuth=async()=>{
    const email=fEmail.trim().toLowerCase(), pass=fPass;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return flash("Enter a valid email");
    if(pass.length<6) return flash("Password must be at least 6 characters");
    setBusy(true);
    try{
      if(authMode==="login"){
        const { error } = await sb.auth.signInWithPassword({email,password:pass});
        if(error) return flash(error.message);
        flash("Welcome back!");
      } else {
        if(!fName.trim()) { setBusy(false); return flash("Enter a display name"); }
        const { data:okInvite, error:invErr } = await sb.rpc("check_invite",{p_code:fInvite});
        if(invErr || !okInvite){ setBusy(false); return flash("Invalid invitation code — ask the commissioner for it."); }
        const { data, error } = await sb.auth.signUp({email,password:pass});
        if(error) return flash(error.message);
        if(!data.session){ setBusy(false); return flash("Check your email to confirm, then log in. (Or ask the commissioner to turn off email confirmation.)"); }
        const uid=data.user.id;
        await sb.from("profiles").insert({id:uid,email,display_name:fName.trim()});
        const { data:pm } = await sb.from("pool_meta").select("*").eq("id",1).maybeSingle();
        if(pm && !pm.commissioner){ await sb.from("pool_meta").update({commissioner:uid,name:fPool.trim()||"World Cup 2026 Pool"}).eq("id",1); }
        flash("Account created — you're in!");
      }
    }catch(e){ flash("Something went wrong — try again."); }
    finally{ setBusy(false); }
  };
  const forgotPass=async()=>{
    const email=fEmail.trim().toLowerCase();
    if(!email) return flash("Type your email above first, then tap reset");
    setBusy(true);
    const { error } = await sb.auth.resetPasswordForEmail(email,{ redirectTo: window.location.origin });
    setBusy(false);
    flash(error ? (error.message||"Couldn't send reset email") : "Check your email for a reset link 📧");
  };
  const doReset=async()=>{
    if((newPass||"").length<6) return flash("New password must be at least 6 characters");
    setBusy(true);
    const { data, error } = await sb.auth.updateUser({ password:newPass });
    setBusy(false);
    if(error) return flash(error.message||"Couldn't update password");
    setNewPass(""); setRecovery(false);
    if(data&&data.user){ await hydrateMe(data.user); }
    flash("Password updated — you're in ✓");
  };
  const logout=async()=>{ await sb.auth.signOut(); setMe(null); setMyS({}); setMyB({}); setTab("picks"); };

  // ---- PICKS ----
  const setScore=(mid,side,val)=>{ if(isLocked(matchById[mid]))return; let n=val===""?"":Math.max(0,Math.min(99,parseInt(val,10)||0)); setMyS(p=>({...p,[mid]:{...p[mid],[side]:n}})); setDirty(true); };
  const toggleBanker=(g,mid)=>{ if(isLocked(matchById[mid]))return; setMyB(p=>{const n={...p}; n[g]===mid?delete n[g]:n[g]=mid; return n;}); setDirty(true); };
  const smartFill=()=>{
    const next={...myS}; let filled=0;
    for(const m of MATCHES){
      if(isLocked(m)) continue;
      const cur=next[m.id];
      if(cur && cur.h!=="" && cur.a!=="" && cur.h!=null && cur.a!=null) continue; // keep picks already made
      const o=odds[m.id]; let h=1,a=1;
      if(o && o.h!=null && o.a!=null){
        const hp=+o.h, dp=+(o.d||0), ap=+o.a;
        if(dp>=hp && dp>=ap){ h=1;a=1; }
        else if(Math.abs(hp-ap)<=8){ h=1;a=1; }
        else if(hp>ap){ h=2; a=(hp-ap)>=25?0:1; }
        else { a=2; h=(ap-hp)>=25?0:1; }
      }
      next[m.id]={h,a}; filled++;
    }
    if(filled>0){ setMyS(next); setDirty(true); flash(`Smart Fill added ${filled} pick${filled!==1?"s":""} — review, then Save`); }
    else flash("Nothing to fill — your open matches already have picks.");
  };
  const savePicks=async()=>{
    if(!me)return; setBusy(true);
    const rows=[];
    for(const [mid,v] of Object.entries(myS)) if(v&&v.h!==""&&v.a!==""&&v.h!=null&&v.a!=null)
      rows.push({user_id:me.id,match_id:mid,home:+v.h,away:+v.a,is_banker:myB[matchById[mid].g]===mid});
    const { error } = await sb.from("picks").upsert(rows,{onConflict:"user_id,match_id"});
    setBusy(false);
    if(error){ flash("Save failed: "+error.message); return; }
    setDirty(false); await loadAll(me.id); flash("Picks saved ✓");
  };

  // ---- RESULTS (commissioner) ----
  const setResult=(mid,side,val)=>{let n=val===""?"":Math.max(0,Math.min(99,parseInt(val,10)||0));setResultDraft(p=>({...p,[mid]:{...p[mid],[side]:n}}));};
  const saveResults=async()=>{
    setBusy(true);
    const rows=[];
    for(const [mid,v] of Object.entries(resultDraft)) if(v&&v.h!==""&&v.a!==""&&v.h!=null&&v.a!=null)
      rows.push({match_id:mid,home:+v.h,away:+v.a});
    const { error } = await sb.from("results").upsert(rows,{onConflict:"match_id"});
    setBusy(false);
    if(error){ flash("Save failed: "+error.message); return; }
    await loadAll(me.id); flash("Results saved ✓");
  };

  // ---- STANDINGS ----
  const standings=useMemo(()=>{
    const rows=players.map(pl=>{
      const pk=allPicks[pl.id]||{}; let pts=0,exact=0,gd=0,result=0,bankHit=0,made=Object.keys(pk).length;
      for(const [mid,res] of Object.entries(results)){
        const p=pk[mid]; if(!p) continue;
        const e=scorePick({h:p.h,a:p.a},res); const earned=e.pts*(p.banker?2:1); pts+=earned;
        if(e.tier==="exact")exact++; else if(e.tier==="gd")gd++; else if(e.tier==="result")result++;
        if(p.banker&&e.pts>0)bankHit++;
      }
      return {...pl,pts,exact,gd,result,bankHit,made};
    });
    rows.sort((a,b)=>b.pts-a.pts||b.exact-a.exact||b.gd-a.gd||a.name.localeCompare(b.name));
    return rows;
  },[players,allPicks,results]);

  const tables=useMemo(()=>{
    const out={};
    for(const g of GROUPS){
      const teams={};
      MATCHES.filter(x=>x.g===g).forEach(m=>{teams[m.h]??={t:m.h,P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0};teams[m.a]??={t:m.a,P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0};});
      MATCHES.filter(x=>x.g===g).forEach(m=>{const r=results[m.id];if(!r)return;const H=teams[m.h],A=teams[m.a];H.P++;A.P++;H.GF+=r.h;H.GA+=r.a;A.GF+=r.a;A.GA+=r.h;if(r.h>r.a){H.W++;A.L++;H.Pts+=3;}else if(r.h<r.a){A.W++;H.L++;A.Pts+=3;}else{H.D++;A.D++;H.Pts++;A.Pts++;}});
      out[g]=Object.values(teams).map(t=>({...t,GD:t.GF-t.GA})).sort((a,b)=>b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF||a.t.localeCompare(b.t));
    }
    return out;
  },[results]);

  const myRank=me?standings.findIndex(r=>r.id===me.id)+1:0;
  const meRow=standings.find(s=>s.id===me?.id);
  const decided=Object.keys(results).length;
  const myMade=Object.values(myS).filter(v=>v&&v.h!==""&&v.a!==""&&v.h!=null&&v.a!=null).length;

  const renderMatch=(m)=>{
    const g=m.g; const locked=isLocked(m); const pk=myS[m.id]||{}; const res=results[m.id]; const isB=myB[g]===m.id;
    let earned=null;
    if(res&&pk.h!=null&&pk.a!=null&&pk.h!==""&&pk.a!==""){const e=scorePick({h:+pk.h,a:+pk.a},res);earned={...e,total:e.pts*(isB?2:1)};}
    const diff=koTime(m)-now;
    return (<div key={m.id} className={`match ${locked?"locked":""}`}>
      <div className="teams">
        <div className="team home"><span className="tname">{m.h}</span><span className="flag">{FLAGS[m.h]||"⚽"}</span></div>
        <div className="scorebox">
          <input className="num" type="number" min="0" max="99" value={pk.h??""} disabled={locked} onChange={e=>setScore(m.id,"h",e.target.value)}/>
          <span className="colon">:</span>
          <input className="num" type="number" min="0" max="99" value={pk.a??""} disabled={locked} onChange={e=>setScore(m.id,"a",e.target.value)}/>
        </div>
        <div className="team away"><span className="flag">{FLAGS[m.a]||"⚽"}</span><span className="tname">{m.a}</span></div>
      </div>
      {!res && (
        <div className={`countdown ${(!locked&&diff<3600000)?"soon":""} ${locked?"started":""}`}>
          {locked ? "● Kicked off — picks locked" : "⏱ Kicks off in "+fmtCountdown(diff)}
        </div>)}
      <div className="match-foot">
        <button className={`bankbtn ${isB?"on":""}`} disabled={locked} onClick={()=>toggleBanker(g,m.id)}>★ Banker</button>
        <span className="foot-right">
          <span className="muted tiny">{m.when}</span>
          {res&&<span className="final">FT {res.h}–{res.a}</span>}
          {locked&&!res&&<span className="lockpill">LOCKED</span>}
          {earned&&<span className={`pts ${earned.tier}`}>{earned.total>0?`+${earned.total}`:"+0"}{isB&&earned.pts>0?"★":""}</span>}
        </span>
      </div>
    </div>);
  };
  const next48=MATCHES.filter(m=>{const t=koTime(m);return t>now && (t-now)<=48*3600*1000;}).sort((a,b)=>koTime(a)-koTime(b));

  if(recovery) return (<div className="container">
    <div className="join">
      <div className="kicker">RESET PASSWORD</div>
      <h1 className="display join-title">Set a new password</h1>
      <p className="muted join-sub">Pick a new password for your account — you'll be logged straight in.</p>
      <input className="field" type="password" placeholder="New password (6+ characters)" value={newPass} onChange={e=>setNewPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doReset()} />
      <button className="btn btn-primary big" onClick={doReset} disabled={busy}>{busy?"…":"Save new password →"}</button>
    </div>
    {toast&&<div className="toast">{toast}</div>}
  </div>);

  if(booting) return <div className="container"><div className="center muted">Loading the pool…</div></div>;

  // ===== AUTH =====
  if(!me){
    const firstEver=players.length===0;
    return (<div className="container">
      <div className="join">
        <div className="kicker">PREDICT · SCORE · CLIMB</div>
        <h1 className="display join-title">{authMode==="login"?"Log In":"Create Account"}</h1>
        <p className="muted join-sub">{players.length>0?<>Pool: <b style={{color:"var(--text)"}}>{poolName}</b> · {players.length} player{players.length>1?"s":""}</>:"You're first — name the pool and you'll be commissioner."}</p>
        {authMode==="signup"&&firstEver&&<input className="field" placeholder="Pool name" value={fPool} onChange={e=>setFPool(e.target.value)} />}
        <input className="field" type="email" placeholder="Email" value={fEmail} onChange={e=>setFEmail(e.target.value)} />
        {authMode==="signup"&&<input className="field" placeholder="Display name" value={fName} onChange={e=>setFName(e.target.value)} />}
        {authMode==="signup"&&<input className="field" placeholder="Invitation code" value={fInvite} onChange={e=>setFInvite(e.target.value)} />}
        <input className="field" type="password" placeholder="Password (6+ characters)" value={fPass} onChange={e=>setFPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doAuth()} />
        <button className="btn btn-primary big" onClick={doAuth} disabled={busy}>{busy?"…":(authMode==="login"?"Log In →":"Sign Up →")}</button>
        <button className="btn-link" onClick={()=>setAuthMode(authMode==="login"?"signup":"login")}>{authMode==="login"?"Need an account? Sign up":"Have an account? Log in"}</button>
        {authMode==="login"&&<button className="btn-link" onClick={forgotPass} disabled={busy}>Forgot password?</button>}
        <div className="note muted">Your login is secured by Supabase. Share this site's link with your group — everyone signs up with their own email and the leaderboard is shared.</div>
      </div>
      {toast&&<div className="toast">{toast}</div>}
    </div>);
  }

  // ===== MAIN =====
  return (<div className="container">
    <header className="head">
      <div><div className="rollband-wrap"><div className="rollband" key={Math.floor(now/10000)} dir="auto">{BANNER[Math.floor(now/10000)%BANNER.length]}</div></div><h1 className="display title">Doostan World Cup '26 Pick'em</h1></div>
      <div className="you">
        <div className="you-name">{me.name}{isCommish&&<span className="badge-c">COMMISH</span>}</div>
        <div className="muted tiny">Rank {myRank?`#${myRank}`:"—"} · {meRow?.pts??0} pts</div>
        <button className="btn-link sm" onClick={logout}>Log out</button>
      </div>
    </header>

    <div className="statbar">
      <Stat label="Players" value={players.length}/>
      <Stat label="Your picks" value={`${myMade}/${MATCHES.length}`}/>
      <Stat label="Results in" value={`${decided}/${MATCHES.length}`}/>
      <Stat label="Your points" value={meRow?.pts??0} accent/>
    </div>

    <nav className="tabs">
      <button className={`tab ${tab==="picks"?"active":""}`} onClick={()=>setTab("picks")}>Picks</button>
      <button className={`tab ${tab==="board"?"active":""}`} onClick={()=>{loadAll(me.id);setTab("board");}}>Leaderboard</button>
      <button className={`tab ${tab==="picksall"?"active":""}`} onClick={()=>{loadAll(me.id);setTab("picksall");}}>All Picks</button>
      <button className={`tab ${tab==="hive"?"active":""}`} onClick={()=>{loadAll(me.id);setTab("hive");}}>Hive Mind</button>
      <button className={`tab ${tab==="tables"?"active":""}`} onClick={()=>{loadAll(me.id);setTab("tables");}}>Tables</button>
      <button className={`tab ${tab==="odds"?"active":""}`} onClick={()=>{loadAll(me.id);setTab("odds");}}>Odds</button>
      <button className={`tab ${tab==="bet"?"active":""}`} onClick={()=>setTab("bet")} dir="auto">کازینوی کُری</button>
      <button className={`tab ${tab==="chat"?"active":""}`} onClick={()=>setTab("chat")} dir="auto">کل‌کل فوتبالی</button>
      {isCommish&&<button className={`tab ${tab==="results"?"active":""}`} onClick={()=>setTab("results")}>Results</button>}
    </nav>

    {tab==="picks"&&<>
      <div className="legend">
        <span className="pill exact">Exact 5</span><span className="pill gd">+GD 3</span>
        <span className="pill result">Result 2</span><span className="pill bank">★ Banker 2×</span>
        <span className="muted" style={{marginLeft:"auto"}}>locks at kickoff</span>
      </div>
      {next48.length>0&&<div className="upcoming">
        <div className="section-head up"><span>⏱ Next 48 hours</span><span className="muted tiny">{next48.length} match{next48.length!==1?"es":""} · get your picks in</span></div>
        {next48.map(m=>renderMatch(m))}
      </div>}
      <div className="section-head all"><span>All matches by group</span></div>
      {GROUPS.map(g=>{
        const open=openGroups.has(g); const games=MATCHES.filter(m=>m.g===g);
        const gMade=games.filter(m=>{const v=myS[m.id];return v&&v.h!==""&&v.a!==""&&v.h!=null&&v.a!=null;}).length;
        return (<div key={g} className="group">
          <button className="group-head" onClick={()=>setOpenGroups(s=>{const n=new Set(s);n.has(g)?n.delete(g):n.add(g);return n;})}>
            <span className="group-tag">GROUP {g}</span>
            <span className="muted tiny">{gMade}/6 picked{myB[g]?" · ★ set":""}</span>
            <span className="caret">{open?"−":"+"}</span>
          </button>
          {open&&games.map(m=>renderMatch(m))}
        </div>);
      })}
      <div className="savebar">{isCommish&&<button className="btn btn-smart big" onClick={smartFill}>✨ Smart Fill</button>}<button className="btn btn-primary big" onClick={savePicks} disabled={!dirty||busy}>{busy?"Saving…":(dirty?"Save my picks":"All saved ✓")}</button></div>
    </>}

    {tab==="board"&&<div className="board">
      {standings.length===0&&<div className="muted center">No players yet.</div>}
      {standings.map((r,i)=>(<div key={r.id} className={`lb ${r.id===me.id?"merow":""} ${i<3?`top top${i+1}`:""}`}>
        <div className="lb-rank">{i+1}</div>
        <div className="lb-mid"><div className="lb-name">{r.name}{r.id===me.id&&<span className="meflag">YOU</span>}</div>
          <div className="muted tiny">{r.exact} exact · {r.gd} +GD · {r.result} result · {r.bankHit} ★ hit</div></div>
        <div className="lb-pts">{r.pts}<span className="ptlbl">pts</span></div>
      </div>))}
    </div>}

    {tab==="picksall"&&<div className="allpicks">
      <p className="muted tiny" style={{marginBottom:12}}>Everyone's predictions. Each match stays hidden until kickoff so nobody can copy — the result and points appear once the score is in.</p>
      {isCommish&&<div className="commishnote">👑 Commissioner: you can see every pick before kickoff. Everyone else only sees a match after it kicks off.</div>}
      {MATCHES.map(m=>{
        const locked=isLocked(m); const reveal=locked||isCommish; const res=results[m.id];
        const here=players.map(pl=>({pl,pk:allPicks[pl.id]&&allPicks[pl.id][m.id]})).filter(x=>x.pk);
        return (<div key={m.id} className="apmatch">
          <div className="aphead">
            <span className="aptitle">{FLAGS[m.h]||"⚽"} {m.h} <span className="apv">v</span> {m.a} {FLAGS[m.a]||"⚽"}{isCommish&&!locked&&<span className="apearly">👑 early view</span>}</span>
            {res?<span className="apres">{res.h}–{res.a}</span>:<span className="apwhen">{m.when}</span>}
          </div>
          {!reveal
            ? <div className="aphidden">🔒 Reveals at kickoff · {here.length} pick{here.length!==1?"s":""} in</div>
            : here.length===0
              ? <div className="aphidden">No picks {locked?"were":"yet"} made.</div>
              : <div className="aplist">{here.map(({pl,pk})=>{
                  let earned=null; if(res){const e=scorePick({h:pk.h,a:pk.a},res); earned={...e,total:e.pts*(pk.banker?2:1)};}
                  return (<div key={pl.id} className={`aprow ${pl.id===me.id?"me":""}`}>
                    <span className="apname" dir="auto">{pl.name||"Player"}{pl.id===me.id?" (you)":""}</span>
                    <span className="appred">{pk.h}–{pk.a}{pk.banker?<span className="apbank" title="Banker">★</span>:null}</span>
                    {res&&<span className={`appts ${earned.tier}`}>{earned.total>0?"+"+earned.total:"0"}</span>}
                  </div>);
                })}</div>}
        </div>);
      })}
    </div>}

    {tab==="hive"&&<div className="hive">
      <p className="muted tiny" style={{marginBottom:12}}>The crowd's predictions, totaled up — no names, just how many picked each score. See where everyone's leaning. 🐝</p>
      {MATCHES.map(m=>{
        const counts={}; let total=0;
        players.forEach(pl=>{const pk=allPicks[pl.id]&&allPicks[pl.id][m.id]; if(pk&&pk.h!=null&&pk.a!=null){const k=pk.h+"–"+pk.a; counts[k]=(counts[k]||0)+1; total++;}});
        const rows=Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
        const max=rows.length?rows[0][1]:1; const res=results[m.id]; const rk=res?res.h+"–"+res.a:null;
        return (<div key={m.id} className="hivecard">
          <div className="hivehead">
            <span className="hivetitle">{FLAGS[m.h]||"⚽"} {m.h} <span className="apv">v</span> {m.a} {FLAGS[m.a]||"⚽"}</span>
            {res?<span className="apres">{res.h}–{res.a}</span>:<span className="apwhen">{m.when}</span>}
          </div>
          {total===0
            ? <div className="aphidden">No picks in yet.</div>
            : rows.map(([k,c])=>(<div key={k} className={`hrow ${k===rk?"hit":""}`}>
                <span className="hbar" style={{width:(c/max*100)+"%"}}></span>
                <span className="hcount">{c}</span><span className="hlabel">picked <span className="hscore">{k}</span></span>
                {k===rk&&<span className="hcheck">✓ result</span>}
              </div>))}
          {total>0&&<div className="hivetot">{total} pick{total!==1?"s":""} total</div>}
        </div>);
      })}
    </div>}

    {tab==="tables"&&<div className="tablesview">
      <p className="muted tiny" style={{marginBottom:10}}>Live group tables from results.<span className="adv-dot"></span> top 2 advance ·<span className="third-dot"></span> 3rd (best-thirds race).</p>
      {GROUPS.map(g=>(<div key={g} className="gtable">
        <div className="gtable-head">GROUP {g}</div>
        <div className="trow thead"><span className="tc team">Team</span><span>P</span><span>W</span><span>D</span><span>L</span><span>GD</span><span className="ptcol">Pts</span></div>
        {tables[g].map((t,i)=>(<div key={t.t} className={`trow ${i<2?"adv":i===2?"third":""}`}>
          <span className="tc team"><span className="rk">{i+1}</span>{FLAGS[t.t]||"⚽"} {t.t}</span>
          <span>{t.P}</span><span>{t.W}</span><span>{t.D}</span><span>{t.L}</span><span>{t.GD>0?"+":""}{t.GD}</span><span className="ptcol">{t.Pts}</span>
        </div>))}
      </div>))}
    </div>}

    {tab==="odds"&&<div className="oddsboard">
      <div className="oddlegend">
        <span className="lgnd"><span className="sw" style={{background:"var(--blue)"}}></span>Home win</span>
        <span className="lgnd"><span className="sw" style={{background:"#5b6480"}}></span>Draw</span>
        <span className="lgnd"><span className="sw" style={{background:"var(--primary)"}}></span>Away win</span>
        <span className="muted" style={{marginLeft:"auto"}}>Pool lean reveals at kickoff</span>
      </div>
      {GROUPS.map(g=>{const open=openGroups.has(g);return(<div key={g} className="group">
        <button className="group-head" onClick={()=>setOpenGroups(s=>{const n=new Set(s);n.has(g)?n.delete(g):n.add(g);return n;})}>
          <span className="group-tag">GROUP {g}</span><span className="caret">{open?"−":"+"}</span>
        </button>
        {open&&<div className="oddgroup">{MATCHES.filter(m=>m.g===g).map(m=>{
          const locked=isLocked(m); const mk=odds[m.id];
          let ph=0,pd=0,pa=0,pc=0; const sc={};
          for(const pid in allPicks){const pk=allPicks[pid][m.id]; if(!pk)continue; pc++; const o=outcome(pk.h,pk.a); if(o==="H")ph++; else if(o==="A")pa++; else pd++; const k=pk.h+"\u2013"+pk.a; sc[k]=(sc[k]||0)+1;}
          const pct=(x)=>pc?Math.round(x/pc*100):0;
          let topS=null,topN=0; for(const k in sc){if(sc[k]>topN){topN=sc[k];topS=k;}}
          const Bar=(h,d,a)=>(<div className="bar">
            <div className="seg sh" style={{width:h+"%"}}>{h>=12?h+"%":""}</div>
            <div className="seg sd" style={{width:d+"%"}}>{d>=12?d+"%":""}</div>
            <div className="seg sa" style={{width:a+"%"}}>{a>=12?a+"%":""}</div>
          </div>);
          return (<div key={m.id} className="oddrow">
            <div className="oddteams">
              <span className="ot">{FLAGS[m.h]||"⚽"} {m.h}</span>
              <span className="vs">vs</span>
              <span className="ot" style={{textAlign:"right"}}>{m.a} {FLAGS[m.a]||"⚽"}</span>
            </div>
            <div className="oddline">
              <div className="oddlabel">MARKET LINE</div>
              {mk ? Bar(mk.h,mk.d,mk.a) : <div className="oddempty">Line not posted yet — fills in automatically as the feed connects.</div>}
            </div>
            <div className="oddline">
              <div className="oddlabel">YOUR POOL</div>
              {locked
                ? (pc>0 ? Bar(pct(ph),pct(pd),pct(pa)) : <div className="oddempty">No picks were made on this match.</div>)
                : <div className="oddempty">Revealed at kickoff · {pc} pick{pc!==1?"s":""} in so far</div>}
            </div>
            {locked&&pc>0&&topS&&<div className="oddtop">Most-picked score: {topS} ({topN} of {pc})</div>}
          </div>);
        })}</div>}
      </div>);})}
    </div>}

    {tab==="results"&&isCommish&&<div className="results">
      <p className="muted tiny" style={{marginBottom:12}}>Enter final scores as matches finish — this drives everyone's points and the group tables. (Automatic score syncing can be added later; see the README.)</p>
      {GROUPS.map(g=>(<div key={g} className="group">
        <div className="group-head static"><span className="group-tag">GROUP {g}</span></div>
        {MATCHES.filter(m=>m.g===g).map(m=>{const rd=resultDraft[m.id]||{};return (<div key={m.id} className="match">
          <div className="teams">
            <div className="team home"><span className="tname">{m.h}</span><span className="flag">{FLAGS[m.h]||"⚽"}</span></div>
            <div className="scorebox">
              <input className="num" type="number" min="0" max="99" value={rd.h??""} onChange={e=>setResult(m.id,"h",e.target.value)}/>
              <span className="colon">:</span>
              <input className="num" type="number" min="0" max="99" value={rd.a??""} onChange={e=>setResult(m.id,"a",e.target.value)}/>
            </div>
            <div className="team away"><span className="flag">{FLAGS[m.a]||"⚽"}</span><span className="tname">{m.a}</span></div>
          </div>
          <div className="match-foot"><span className="muted tiny">{m.when}</span></div>
        </div>);})}
      </div>))}
      <div className="savebar"><button className="btn btn-primary big" onClick={saveResults} disabled={busy}>{busy?"Saving…":"Save results"}</button></div>
    </div>}

    {tab==="bet"&&<Betting me={me} flash={flash} commish={isCommish}/>}

    {tab==="chat"&&<div className="majlis">
      <p className="muted tiny" style={{marginBottom:12}}>Talk trash, celebrate, and argue the calls — in Farsi or English, with emojis and GIFs. 🔥</p>
      <Chat me={me} flash={flash}/>
    </div>}

    {toast&&<div className="toast">{toast}</div>}
  </div>);
}

function Betting({me,flash,commish}){
  const [bets,setBets]=useState([]);
  const [board,setBoard]=useState([]);
  const [odds,setOdds]=useState({});
  const [results,setResults]=useState({});
  const [sel,setSel]=useState({});
  const [stakeIn,setStakeIn]=useState({});
  const [busy,setBusy]=useState(null);
  const [tick,setTick]=useState(Date.now());
  const M=useMemo(()=>Object.fromEntries(MATCHES.map(m=>[m.id,m])),[]);

  const load=useCallback(async()=>{
    const [b,o,r,bd]=await Promise.all([
      sb.from("bets").select("*"),
      sb.from("match_odds").select("*"),
      sb.from("results").select("*"),
      sb.rpc("tycoon_board"),
    ]);
    setBets(b.data||[]);
    const om={}; (o.data||[]).forEach(x=>om[x.match_id]=x); setOdds(om);
    const rm={}; (r.data||[]).forEach(x=>rm[x.match_id]={h:x.home,a:x.away}); setResults(rm);
    setBoard((bd.data||[]).slice().sort((a,b)=>Number(b.balance)-Number(a.balance)||(a.name||"").localeCompare(b.name||"")));
  },[]);
  useEffect(()=>{ load(); const t=setInterval(load,15000); return ()=>clearInterval(t); },[load]);
  useEffect(()=>{ const t=setInterval(()=>setTick(Date.now()),30000); return ()=>clearInterval(t); },[]);
  const now=tick;

  const decOdds=(pct)=> (pct&&pct>0) ? Math.min(20,Math.max(1.05, Math.round(100/pct*100)/100)) : null;
  const outcomeOf=(r)=> r.h>r.a?"home": r.h<r.a?"away":"draw";
  const betNet=(bet)=>{ const r=results[bet.match_id]; if(!r) return null; return bet.pick===outcomeOf(r) ? Math.round(bet.stake*(bet.odds-1)) : -bet.stake; };

  const myBets=bets.filter(b=>b.user_id===me.id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const myByMatch={}; myBets.forEach(b=>{myByMatch[b.match_id]=b;});
  const meRow=board.find(t=>t.user_id===me.id);
  const myBalance=meRow?Number(meRow.balance):5000;
  const pendingStake=myBets.filter(b=>!results[b.match_id]).reduce((s,b)=>s+b.stake,0);

  const sideLabel=(m,side)=> side==="home"?m.h : side==="away"?m.a : "Draw";
  const place=async(mid)=>{
    const pick=sel[mid]; const stake=parseInt(stakeIn[mid],10);
    if(!pick) return flash("Tap a side to bet on first");
    if(!stake||stake<1) return flash("Enter how many kori-coin to stake");
    setBusy(mid);
    const {error}=await sb.from("bets").insert({user_id:me.id,match_id:mid,pick,stake,display_name:me.name||"Anon"});
    setBusy(null);
    if(error){ flash(error.message.includes("duplicate")?"You already have a bet on this match":(error.message||"Couldn't place bet")); return; }
    setSel(s=>{const n={...s};delete n[mid];return n;}); setStakeIn(s=>{const n={...s};delete n[mid];return n;});
    flash("Bet placed! 🎲"); load();
  };

  const openMatches=MATCHES.filter(m=> new Date(m.utc).getTime()>now && odds[m.id]).sort((a,b)=>new Date(a.utc)-new Date(b.utc));
  const fmtK=(n)=> (n>0?"+":"")+n.toLocaleString();

  return (<div className="bet-wrap">
    <div className="wallet">
      <div><div className="wlbl">YOUR KORI-COIN · کُری‌کوین</div><div className={`wbal ${myBalance<0?"neg":""}`}>{myBalance.toLocaleString()}</div></div>
      <div className="wmeta">{pendingStake>0?<>کُری {pendingStake.toLocaleString()} riding on open bets</>:"No open bets"}<br/>Everyone starts at 5,000 · you can go negative</div>
    </div>

    <h3 className="bsec">Open matches</h3>
    {openMatches.length===0 && <div className="muted tiny" style={{marginBottom:14}}>No matches are open for betting yet. Lines open once the odds are posted — roughly two days before each kickoff. Check back closer to June 11. ⚽</div>}
    {openMatches.map(m=>{
      const o=odds[m.id]; const mine=myByMatch[m.id];
      const oh=decOdds(o.home_pct), od=decOdds(o.draw_pct), oa=decOdds(o.away_pct);
      return (<div key={m.id} className="betcard">
        <div className="betteams"><span className="bt" dir="auto">{(FLAGS[m.h]||"")+" "+m.h}</span><span className="bvs">vs</span><span className="bt" dir="auto">{(FLAGS[m.a]||"")+" "+m.a}</span></div>
        <div className="bwhen">{m.when}</div>
        {mine
          ? <div className="betlocked">🔒 Your bet: <b>{mine.stake.toLocaleString()}</b> on <b>{sideLabel(m,mine.pick)}</b> @ <b>{(+mine.odds).toFixed(2)}×</b> · to win <b>{Math.round(mine.stake*mine.odds).toLocaleString()}</b></div>
          : <>
            <div className="oddpick">
              {["home","draw","away"].map(side=>{
                const od2 = side==="home"?oh:side==="draw"?od:oa;
                return <button key={side} className={`obtn ${sel[m.id]===side?"on":""}`} disabled={!od2} onClick={()=>setSel(s=>({...s,[m.id]:side}))}>
                  <span className="ol">{side==="draw"?"Draw":sideLabel(m,side)}</span><span className="oo">{od2?od2.toFixed(2)+"×":"—"}</span></button>;
              })}
            </div>
            <div className="betrow">
              <input className="stakein" type="number" min="1" placeholder="Stake (kori-coin)" value={stakeIn[m.id]||""} onChange={e=>setStakeIn(s=>({...s,[m.id]:e.target.value}))}/>
              <button className="btn btn-primary" disabled={busy===m.id} onClick={()=>place(m.id)}>{busy===m.id?"…":"Place bet"}</button>
            </div>
            {sel[m.id]&&stakeIn[m.id]>0 && <div className="bpot">To win <b>{Math.round((+stakeIn[m.id])*(sel[m.id]==="home"?oh:sel[m.id]==="draw"?od:oa)).toLocaleString()}</b> kori-coin</div>}
          </>}
      </div>);
    })}

    <h3 className="bsec">Your bets</h3>
    {myBets.length===0 && <div className="muted tiny" style={{marginBottom:14}}>No bets yet.</div>}
    {myBets.map(b=>{
      const m=M[b.match_id]; const net=betNet(b);
      const status = net==null ? "pending" : net>=0 ? "won" : "lost";
      return (<div key={b.id} className={`mybet ${status}`}>
        <div><div className="mbteams" dir="auto">{m?`${m.h} vs ${m.a}`:b.match_id}</div><div className="mbmeta">{b.stake.toLocaleString()} on {m?sideLabel(m,b.pick):b.pick} @ {(+b.odds).toFixed(2)}×</div></div>
        <div className="mbresult">{status==="pending"?<span className="pend">Pending</span>:<span className={status}>{fmtK(net)}</span>}</div>
      </div>);
    })}

    <h3 className="bsec">🏆 Tycoon leaderboard</h3>
    <div className="tycoon">
      {board.map((t,i)=>(<div key={t.user_id} className={`tyrow ${t.user_id===me.id?"me":""}`}>
        <span className="tyrk">{i+1}</span><span className="tyname" dir="auto">{(t.name||"Player")}{t.user_id===me.id?" (you)":""}</span>
        <span className={`tybal ${Number(t.balance)<0?"neg":""}`}>{Number(t.balance).toLocaleString()}</span>
      </div>))}
    </div>
    <div className="muted tiny" style={{marginTop:10}}>Payout odds come from the match line — a longer shot pays more. Bets lock at kickoff and settle automatically when the score posts. Each player's individual bets are private to them.</div>

    {commish&&<div className="commishbox">
      <h3 className="bsec" style={{marginTop:24,color:"var(--gold)"}}>👑 Commissioner view — all bets</h3>
      <div className="muted tiny" style={{marginBottom:10}}>Only your login can see this. Players cannot see each other's bets.</div>
      {bets.length===0
        ? <div className="muted tiny">No bets placed yet.</div>
        : bets.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(b=>{
            const m=M[b.match_id]; const net=betNet(b); const status=net==null?"pending":net>=0?"won":"lost";
            return (<div key={b.id} className={`mybet ${status}`}>
              <div><div className="mbteams" dir="auto">{b.display_name||"Player"}</div><div className="mbmeta" dir="auto">{m?`${m.h} v ${m.a}`:b.match_id} · {b.stake.toLocaleString()} on {m?sideLabel(m,b.pick):b.pick} @ {(+b.odds).toFixed(2)}×</div></div>
              <div className="mbresult">{status==="pending"?<span className="pend">open</span>:<span className={status}>{fmtK(net)}</span>}</div>
            </div>);
          })}
    </div>}
  </div>);
}

const EMOJIS = ["⚽","🥅","🏆","🔥","😂","😭","😮","😱","🤬","🤡","👏","🙌","💪","🐐","🎉","🥳","💀","👀","🤝","🫡","❤️","💔","🤞","😎","🙏","💯","⭐","🥶","🤯","😤","🤩","👑","🚀","🇮🇷","🇺🇸","🇧🇷"];
const REACTS = ["👍","❤️","😂","😮","😢","🔥"];

function fmtTime(iso){
  const d=new Date(iso), diff=Date.now()-d.getTime();
  if(diff<60000) return "now";
  if(diff<3600000) return Math.floor(diff/60000)+"m";
  if(diff<86400000) return Math.floor(diff/3600000)+"h";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}

function Chat({me,flash}){
  const [msgs,setMsgs]=useState([]);
  const [text,setText]=useState("");
  const [showEmoji,setShowEmoji]=useState(false);
  const [showGif,setShowGif]=useState(false);
  const [gifQ,setGifQ]=useState("");
  const [gifs,setGifs]=useState([]);
  const [sending,setSending]=useState(false);
  const [replyTo,setReplyTo]=useState(null); // {id,name,preview}
  const [reacts,setReacts]=useState([]);
  const [openReact,setOpenReact]=useState(null); // message id whose reaction palette is open
  const endRef=React.useRef(null), taRef=React.useRef(null), logRef=React.useRef(null), atBottom=React.useRef(true);
  const noKey=GIPHY_KEY.includes("PASTE");

  const load=useCallback(async()=>{
    const [mRes,rRes]=await Promise.all([
      sb.from("messages").select("*").order("created_at",{ascending:true}).limit(500),
      sb.from("reactions").select("message_id,user_id,emoji"),
    ]);
    setMsgs(mRes.data||[]); setReacts(rRes.data||[]);
  },[]);
  useEffect(()=>{ load(); const t=setInterval(load,5000); return ()=>clearInterval(t); },[load]);
  useEffect(()=>{ if(atBottom.current&&endRef.current) endRef.current.scrollIntoView({behavior:"smooth"}); },[msgs.length]);
  const onScroll=()=>{ const el=logRef.current; if(el) atBottom.current = el.scrollHeight-el.scrollTop-el.clientHeight < 140; };

  // build the reply tree
  const {roots,kids,byId}=useMemo(()=>{
    const byId={}; msgs.forEach(m=>{byId[m.id]=m;});
    const kids={}, roots=[];
    msgs.forEach(m=>{ if(m.parent_id&&byId[m.parent_id]) (kids[m.parent_id]=kids[m.parent_id]||[]).push(m); else roots.push(m); });
    return {roots,kids,byId};
  },[msgs]);

  const reactMap=useMemo(()=>{
    const map={};
    reacts.forEach(r=>{
      const byMsg=map[r.message_id]=map[r.message_id]||{};
      const cell=byMsg[r.emoji]=byMsg[r.emoji]||{count:0,mine:false};
      cell.count++; if(r.user_id===me.id) cell.mine=true;
    });
    return map;
  },[reacts,me.id]);

  const toggleReact=async(mid,emoji)=>{
    const cell=reactMap[mid]&&reactMap[mid][emoji];
    if(cell&&cell.mine) await sb.from("reactions").delete().eq("message_id",mid).eq("user_id",me.id).eq("emoji",emoji);
    else await sb.from("reactions").insert({message_id:mid,user_id:me.id,emoji});
    setOpenReact(null); load();
  };

  const send=async(body,gif)=>{
    body=(body||"").trim();
    if(!body && !gif) return;
    setSending(true);
    const {error}=await sb.from("messages").insert({user_id:me.id,display_name:me.name||"Anon",body:body||null,gif_url:gif||null,parent_id:replyTo?replyTo.id:null});
    setSending(false);
    if(error){ flash("Couldn't send — try again"); return; }
    setText(""); setShowEmoji(false); setShowGif(false); setGifQ(""); setGifs([]); setReplyTo(null);
    atBottom.current=true; load();
  };

  const searchGifs=useCallback(async(q)=>{
    if(noKey) return;
    const base=q ? `https://api.giphy.com/v1/gifs/search?q=${encodeURIComponent(q)}&` : `https://api.giphy.com/v1/gifs/trending?`;
    try{
      const r=await fetch(`${base}api_key=${GIPHY_KEY}&limit=24&rating=pg-13`);
      const j=await r.json();
      setGifs((j.data||[]).map(g=>({id:g.id,thumb:g.images.fixed_height_small.url,full:g.images.fixed_height.url})));
    }catch(e){ setGifs([]); }
  },[noKey]);
  useEffect(()=>{ if(!showGif) return; const t=setTimeout(()=>searchGifs(gifQ),350); return ()=>clearTimeout(t); },[gifQ,showGif,searchGifs]);

  const del=async(id)=>{ await sb.from("messages").delete().eq("id",id); load(); };
  const preview=(m)=> (m.body || (m.gif_url?"GIF":"")).slice(0,70);
  const startReply=(m)=>{ setReplyTo({id:m.id,name:m.display_name||"Anon",preview:preview(m)}); if(taRef.current) taRef.current.focus(); };

  const Node=(m,depth)=>{
    const mine=m.user_id===me.id;
    const children=kids[m.id]||[];
    const parent=m.parent_id?byId[m.parent_id]:null;
    const ind=Math.min(depth,5)*16;
    const rx=reactMap[m.id];
    return (<div key={m.id} className="cnode" style={{marginLeft:ind}}>
      <div className={`cmsg ${mine?"mine":""} ${depth>0?"reply":""}`}>
        {parent&&<div className="crefer">↩ <b>{parent.display_name||"Anon"}</b><span className="rfx" dir="auto">{preview(parent)}</span></div>}
        <div className="cmeta"><span className="cname">{m.display_name||"Anon"}</span><span className="ctime">{fmtTime(m.created_at)}</span></div>
        {m.body&&<div className="cbody" dir="auto">{m.body}</div>}
        {m.gif_url&&<img className="cgif" src={m.gif_url} alt="gif" loading="lazy"/>}
        {rx&&Object.keys(rx).length>0&&<div className="creacts">{Object.keys(rx).map(e=>(
          <button key={e} className={`rbadge ${rx[e].mine?"mine":""}`} onClick={()=>toggleReact(m.id,e)}>{e}<span className="rc">{rx[e].count}</span></button>
        ))}</div>}
        {openReact===m.id&&<div className="repop">{REACTS.map(e=>(<button key={e} onClick={()=>toggleReact(m.id,e)}>{e}</button>))}</div>}
        <div className="cactions">
          <button className="clink" onClick={()=>setOpenReact(o=>o===m.id?null:m.id)}>😊 React</button>
          <button className="clink" onClick={()=>startReply(m)}>↩ Reply</button>
          {mine&&<button className="clink" onClick={()=>del(m.id)}>Delete</button>}
        </div>
      </div>
      {children.map(c=>Node(c,depth+1))}
    </div>);
  };

  return (<div className="chat">
    <div className="chatlog" ref={logRef} onScroll={onScroll}>
      {roots.length===0 && <div className="muted center">No messages yet — kick it off! 🔥</div>}
      {roots.map(m=>Node(m,0))}
      <div ref={endRef}></div>
    </div>

    {showEmoji&&<div className="emojibar">{EMOJIS.map(e=>(<button key={e} className="emoji" onClick={()=>{setText(t=>t+e); taRef.current&&taRef.current.focus();}}>{e}</button>))}</div>}

    {showGif&&<div className="gifpanel">
      <input className="gifsearch" placeholder={noKey?"GIFs need a free GIPHY key":"Search GIFs…"} value={gifQ} onChange={e=>setGifQ(e.target.value)} disabled={noKey}/>
      {noKey
        ? <div className="muted tiny" style={{padding:"4px 2px"}}>GIFs are off until a free GIPHY key is added — ask to turn them on. Emoji and text already work.</div>
        : <><div className="gifgrid">{gifs.map(g=>(<img key={g.id} className="gifthumb" src={g.thumb} onClick={()=>send("",g.full)} alt="gif"/>))}</div><div className="giphy-attrib">Powered by GIPHY</div></>}
    </div>}

    {replyTo&&<div className="replybar"><span className="rtx muted tiny">Replying to <b style={{color:"var(--text)"}}>{replyTo.name}</b>{replyTo.preview?` · ${replyTo.preview}`:""}</span><button className="cdel" onClick={()=>setReplyTo(null)} title="Cancel reply">×</button></div>}

    <div className="composer">
      <button className={`cbtn ${showEmoji?"on":""}`} onClick={()=>{setShowEmoji(s=>!s);setShowGif(false);}} title="Emoji">😀</button>
      <button className={`cbtn ${showGif?"on":""}`} onClick={()=>{const n=!showGif;setShowGif(n);setShowEmoji(false);if(n)searchGifs("");}} title="GIF">GIF</button>
      <textarea ref={taRef} className="cinput" rows="1" placeholder={replyTo?`Reply to ${replyTo.name}…`:"Message… (Farsi or English)"} dir="auto" value={text}
        onChange={e=>setText(e.target.value)}
        onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(text);}}}/>
      <button className="csend" onClick={()=>send(text)} disabled={sending||!text.trim()}>{sending?"…":"Send"}</button>
    </div>
  </div>);
}

function Stat({label,value,accent}){return <div className={`stat ${accent?"accent":""}`}><div className="stat-val">{value}</div><div className="stat-lbl">{label}</div></div>;}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
